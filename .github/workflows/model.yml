# One-time: copies the Persian speech-to-text model into this repo's Releases,
# so the app can download it from GitHub (works where the original site is slow or blocked).
name: Persian speech model

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/model.yml' ]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set -e
          mkdir out
          for m in vosk-model-small-fa-0.42 vosk-model-small-fa-0.5 vosk-model-small-fa-0.4; do
            if curl -fL --retry 3 -o out/vosk-fa.zip "https://alphacephei.com/vosk/models/$m.zip"; then
              echo "$m" > out/vosk-fa.txt; break
            fi
          done
          ls -la out
          test -s out/vosk-fa.zip
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: Speech model (Persian)
          body: "مدل فارسی تبدیل گفتار به متن — برنامه خودش این را دانلود می‌کند."
          files: |
            out/vosk-fa.zip
            out/vosk-fa.txt
          make_latest: false
